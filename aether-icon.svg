<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2E" />
      <stop offset="50%" stop-color="#2D2B55" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89B4FA" />
      <stop offset="50%" stop-color="#CBA6F7" />
      <stop offset="100%" stop-color="#F5C2E7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Cloud / Folder Frame -->
  <path d="M 130 170 C 130 148 148 130 170 130 L 230 130 C 245 130 258 138 265 150 L 285 180 C 290 188 300 192 310 192 L 342 192 C 364 192 382 210 382 232 L 382 350 C 382 372 364 390 342 390 L 170 390 C 148 390 130 372 130 350 Z" fill="#181825" fill-opacity="0.8" stroke="url(#accentGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Inner Network Nodes / SSH Terminal Connection Symbol -->
  <g filter="url(#glow)">
    <!-- Nodes -->
    <circle cx="200" cy="280" r="18" fill="#89B4FA" />
    <circle cx="312" cy="280" r="18" fill="#CBA6F7" />
    <circle cx="256" cy="220" r="16" fill="#F5C2E7" />
    
    <!-- Connecting Lines -->
    <line x1="200" y1="280" x2="256" y2="220" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="312" y1="280" x2="256" y2="220" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" />
    <line x1="200" y1="280" x2="312" y2="280" stroke="#89B4FA" stroke-width="8" stroke-dasharray="12 8" stroke-linecap="round" />
  </g>
  
  <!-- Minimalist Cursor / Prompt Accent -->
  <path d="M 240 330 L 272 330" stroke="#A6E3A1" stroke-width="10" stroke-linecap="round" />
</svg>
